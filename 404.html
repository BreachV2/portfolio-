<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="404 – Seite nicht gefunden" />
  <title>404 | BreachV3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-primary:   #02060d;
      --bg-secondary: #060f1e;
      --bg-card:      rgba(6, 15, 30, 0.75);
      --border:       rgba(0, 212, 255, 0.10);
      --border-h:     rgba(0, 212, 255, 0.32);
      --accent:       #00d4ff;
      --accent-g:     #00ff9d;
      --accent-err:   #ff4d6a;
      --accent-warn:  #febc2e;
      --accent-glow:  rgba(0, 212, 255, 0.12);
      --text:         #e2e8f0;
      --text-2:       rgba(226,232,240,0.58);
      --text-3:       rgba(226,232,240,0.30);
      --r:            12px;
      --tr:           .35s cubic-bezier(0.16,1,0.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg-primary);
      color: var(--text);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    .grid-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0,212,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-err), transparent);
      opacity: .28; animation: scan 9s linear infinite; pointer-events: none; z-index: 1;
    }
    @keyframes scan { 0%{ top:0; } 100%{ top:100%; } }

    .glow-orb {
      position: fixed; pointer-events: none; z-index: 0;
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,77,106,.06) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }

    .container {
      position: relative; z-index: 2;
      width: 100%; max-width: 680px;
      padding: 24px;
    }

    .code-404 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(90px, 18vw, 180px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,77,106,.35);
      user-select: none;
      margin-bottom: 4px;
      position: relative;
    }
    .code-404::after {
      content: '404';
      position: absolute; inset: 0;
      color: transparent;
      -webkit-text-stroke: 1px rgba(0,212,255,.12);
      transform: translate(4px, 3px);
    }

    .terminal {
      background: rgba(0,8,20,.80);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255,77,106,.18);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255,77,106,.07), 0 24px 60px rgba(0,0,0,.5);
    }

    .term-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 12px 16px;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid rgba(255,77,106,.12);
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }
    .term-title { margin-left: 8px; font-size: 11px; color: var(--text-3); letter-spacing: .04em; }

    .term-body {
      padding: 22px 22px 26px;
      font-size: 13px;
      line-height: 2;
    }

    .line { display: flex; align-items: flex-start; gap: 10px; }
    .line + .line { margin-top: 2px; }

    .prompt-sym  { color: var(--text-3); flex-shrink: 0; }
    .err         { color: var(--accent-err); }
    .warn        { color: var(--accent-warn); }
    .ok          { color: var(--accent-g); }
    .dim         { color: var(--text-3); }
    .accent      { color: var(--accent); }

    .cursor {
      display: inline-block; width: 8px; height: 15px;
      background: var(--accent); vertical-align: middle;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,77,106,.10);
      margin: 18px 0;
    }

    .actions {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-top: 28px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 500;
      letter-spacing: .04em; text-decoration: none; border: 1px solid;
      transition: all var(--tr);
    }
    .btn-home {
      background: rgba(0,212,255,.08);
      border-color: rgba(0,212,255,.32);
      color: var(--accent);
    }
    .btn-home:hover {
      background: rgba(0,212,255,.16);
      border-color: var(--accent);
      box-shadow: 0 0 22px rgba(0,212,255,.18);
      transform: translateY(-2px);
    }
    .btn-back {
      background: transparent;
      border-color: rgba(226,232,240,.12);
      color: var(--text-2);
    }
    .btn-back:hover {
      border-color: rgba(226,232,240,.28);
      color: var(--text);
      transform: translateY(-2px);
    }

    .typed-line { overflow: hidden; white-space: nowrap; }
    .typed-line.hidden { opacity: 0; }

    .nav-logo {
      position: fixed; top: 24px; left: 32px; z-index: 10;
      font-size: 16px; font-weight: 700; letter-spacing: .10em;
      color: var(--accent-g); text-shadow: 0 0 14px rgba(0,255,157,.35);
      text-decoration: none; transition: opacity .3s;
    }
    .nav-logo:hover { opacity: .75; }

    @media (max-width: 480px) {
      .nav-logo { left: 20px; top: 20px; }
      .term-body { padding: 16px 16px 20px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scan-line"></div>
<div class="glow-orb"></div>

<a href="index.html" class="nav-logo">&lt;BreachV3 /&gt;</a>

<div class="container">

  <div class="code-404" aria-hidden="true">404</div>

  <div class="terminal">
    <div class="term-bar">
      <span class="dot dot-r"></span>
      <span class="dot dot-y"></span>
      <span class="dot dot-g"></span>
      <span class="term-title">breach@v3 ~ $ trace-route</span>
    </div>
    <div class="term-body" id="term-body">

    </div>
  </div>

  <div class="actions">
    <a href="index.html" class="btn btn-home">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Zurueck zur Startseite
    </a>
    <button class="btn btn-back" onclick="history.back()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Zurueck
    </button>
  </div>

</div>

<script>
  const lines = [
    { delay: 0,    html: '<span class="line"><span class="prompt-sym">$</span><span> trace-route <span class="accent">' + location.pathname + '</span></span></span>' },
    { delay: 400,  html: '<span class="line"><span class="prompt-sym"> </span><span class="dim">Resolving host... connecting to node cluster...</span></span>' },
    { delay: 900,  html: '<span class="line"><span class="prompt-sym"> </span><span class="dim">Hop 1 &nbsp;10.0.0.1 &nbsp;&nbsp;&nbsp;&nbsp;[ <span class="ok">2ms</span> ]</span></span>' },
    { delay: 1200, html: '<span class="line"><span class="prompt-sym"> </span><span class="dim">Hop 2 &nbsp;172.16.0.1 &nbsp;[ <span class="ok">8ms</span> ]</span></span>' },
    { delay: 1550, html: '<span class="line"><span class="prompt-sym"> </span><span class="dim">Hop 3 &nbsp;192.168.0.1 [ <span class="warn">34ms</span> ]</span></span>' },
    { delay: 1950, html: '<span class="line"><span class="prompt-sym"> </span><span class="dim">Hop 4 &nbsp;* * * &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[ <span class="err">timeout</span> ]</span></span>' },
    { delay: 2400, html: '<hr class="divider" />' },
    { delay: 2600, html: '<span class="line"><span class="err">ERROR &nbsp;</span><span class="err">[0x404] PATH_NOT_FOUND</span></span>' },
    { delay: 2950, html: '<span class="line"><span class="warn">WARN &nbsp;&nbsp;</span><span>Requested resource does not exist on this server</span></span>' },
    { delay: 3300, html: '<span class="line"><span class="warn">WARN &nbsp;&nbsp;</span><span>Route <span class="accent">' + location.pathname + '</span> could not be resolved</span></span>' },
    { delay: 3700, html: '<hr class="divider" />' },
    { delay: 3900, html: '<span class="line"><span class="ok">INFO &nbsp;&nbsp;</span><span>Suggested fix: navigate to a valid endpoint</span></span>' },
    { delay: 4300, html: '<span class="line"><span class="prompt-sym">$</span><span class="cursor"></span></span>' },
  ];

  const body = document.getElementById('term-body');

  lines.forEach(({ delay, html }) => {
    setTimeout(() => {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = html;
      Array.from(wrapper.childNodes).forEach(node => body.appendChild(node));
    }, delay);
  });
</script>

</body>
</html>
